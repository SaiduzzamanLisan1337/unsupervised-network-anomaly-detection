[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoencoder-network-anomaly-detection"
version = "1.2.0"
description = "Unsupervised network anomaly detection with a denoising autoencoder and Isolation Forest"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "PyYAML>=6.0,<7",
    "joblib>=1.3,<2",
    "torch>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
anomaly-detect = "anomaly_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
